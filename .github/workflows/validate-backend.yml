name: Validate and format backend

on: [pull_request]

permissions: 
  contents: read

jobs:
  validate-and-format-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check syntax
        run: python -m compileall -q .
      
      - name: Install black
        run: pip install black

      - name: Check formatting
        run: black --check .